{% extends "base.html" %}

{% block title %}数据管理{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>数据管理</h1>
    <p class="text-muted">数据管理功能开发中...</p>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">识别统计</h5>

                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">数据导出</h5>

                    <button class="btn btn-secondary" disabled>开发中</button>

            </div>
        </div>
